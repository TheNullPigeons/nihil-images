name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant to build
        required: true
        default: all
        type: choice
        options:
          - all
          - full
          - ad
          - web
          - blueteam
  repository_dispatch:
    types: [packages-updated]

env:
  REGISTRY: ghcr.io

jobs:
  build-full:
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && (github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == 'full')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref }}

      - name: Resolve image source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/full
          flavor: latest=false
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'repository_dispatch' }}
            type=raw,value=dev,enable=${{ github.event_name == 'repository_dispatch' }}
            type=raw,value=dev-${{ steps.source.outputs.sha }},enable=${{ github.ref == 'refs/heads/dev' || github.event_name == 'repository_dispatch' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'repository_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
            type=raw,value=flock,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image (full)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            TAG=${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref_name }}
            VERSION=${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}

  build-ad:
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && (github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == 'ad')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref }}

      - name: Resolve image source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ad
          flavor: latest=false
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'repository_dispatch' }}
            type=raw,value=dev,enable=${{ github.event_name == 'repository_dispatch' }}
            type=raw,value=dev-${{ steps.source.outputs.sha }},enable=${{ github.ref == 'refs/heads/dev' || github.event_name == 'repository_dispatch' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'repository_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
            type=raw,value=nest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image (ad)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ad
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            TAG=${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref_name }}
            VERSION=${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}

  build-web:
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && (github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == 'web')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref }}

      - name: Resolve image source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/web
          flavor: latest=false
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'repository_dispatch' }}
            type=raw,value=dev,enable=${{ github.event_name == 'repository_dispatch' }}
            type=raw,value=dev-${{ steps.source.outputs.sha }},enable=${{ github.ref == 'refs/heads/dev' || github.event_name == 'repository_dispatch' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'repository_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
            type=raw,value=beak,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image (web)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            TAG=${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref_name }}
            VERSION=${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}

  build-blueteam:
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && (github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == 'blueteam')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref }}

      - name: Resolve image source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/blueteam
          flavor: latest=false
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'repository_dispatch' }}
            type=raw,value=dev,enable=${{ github.event_name == 'repository_dispatch' }}
            type=raw,value=dev-${{ steps.source.outputs.sha }},enable=${{ github.ref == 'refs/heads/dev' || github.event_name == 'repository_dispatch' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'repository_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
            type=raw,value=coo,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image (blueteam)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.blueteam
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            TAG=${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref_name }}
            VERSION=${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the promoted build matches main
        id: source
        shell: bash
        run: |
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            source_sha=$(git rev-parse HEAD^2)
          else
            git fetch origin dev
            source_sha=$(git rev-parse origin/dev)
          fi
          git diff --quiet "$source_sha" HEAD -- Dockerfile Dockerfile.ad Dockerfile.web Dockerfile.blueteam build runtime || {
            echo 'Main differs from the dev image source; promotion stopped.' >&2
            exit 1
          }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all dev images exist
        shell: bash
        run: |
          for variant in full ad web blueteam; do
            image="${{ env.REGISTRY }}/${{ github.repository_owner }}/$variant"
            docker buildx imagetools inspect "$image:dev-${{ steps.source.outputs.sha }}" >/dev/null
          done

      - name: Promote the already built dev images
        shell: bash
        run: |
          for pair in full:flock ad:nest web:beak blueteam:coo; do
            variant=${pair%%:*}
            alias=${pair#*:}
            image="${{ env.REGISTRY }}/${{ github.repository_owner }}/$variant"
            docker buildx imagetools create \
              -t "$image:main" -t "$image:latest" -t "$image:$alias" \
              "$image:dev-${{ steps.source.outputs.sha }}"
          done
